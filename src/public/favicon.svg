<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Machinery Cog / Gear -->
  <g fill="#93c5fd" opacity="0.35">
    <circle cx="32" cy="32" r="14"/>
    <rect x="29" y="14" width="6" height="36" rx="2"/>
    <rect x="14" y="29" width="36" height="6" rx="2"/>
    <rect x="29" y="14" width="6" height="36" rx="2" transform="rotate(45 32 32)"/>
    <rect x="29" y="14" width="6" height="36" rx="2" transform="rotate(-45 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="#1e40af"/>

  <!-- Crossing Repair Tools: Wrench & Screwdriver/Hammer -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench (Diagonal) -->
    <line x1="16" y1="48" x2="44" y2="20" stroke-width="5"/>
    <!-- Wrench Open Head -->
    <path d="M38 14 l10 10 m-8-10 l-3 3 8 8 3-3" fill="none" stroke-width="4"/>
    <circle cx="18" cy="46" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Golden Spark / Tuning Indicator -->
  <circle cx="48" cy="16" r="3.5" fill="url(#sparkGrad)"/>
  <line x1="48" y1="9" x2="48" y2="12" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="20" x2="48" y2="23" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="16" x2="44" y2="16" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="16" x2="55" y2="16" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
</svg>
